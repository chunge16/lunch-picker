  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="100" r="220" fill="#3078c9" opacity="0.12"/>
  <circle cx="1010" cy="120" r="190" fill="#2f9e73" opacity="0.10"/>
  <circle cx="760" cy="620" r="230" fill="#ffb86c" opacity="0.12"/>
  <rect x="118" y="96" width="964" height="438" rx="44" fill="#ffffff" opacity="0.54" filter="url(#shadow)"/>
